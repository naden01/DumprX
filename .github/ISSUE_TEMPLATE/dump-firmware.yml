name: Firmware Dump Request
description: Trigger DumprX firmware dump and post the dump link to Telegram
title: "[Dump] "
labels:
  - dump-request
body:
  - type: input
    id: firmware_url
    attributes:
      label: Firmware URL
      description: Direct download URL or supported filehoster link (mega.nz, mediafire, gdrive, onedrive, androidfilehost)
      placeholder: https://example.com/firmware.zip
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Push Target
      options:
        - github
        - gitlab
      default: 0
    validations:
      required: true
  - type: dropdown
    id: visibility
    attributes:
      label: Repository Visibility
      options:
        - public
        - private
      default: 0
    validations:
      required: true
  - type: input
    id: requested_by
    attributes:
      label: Requested By
      description: Optional name or Telegram @username
      placeholder: "@username"
    validations:
      required: false
