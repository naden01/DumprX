name: DumprX – Dump Firmware & Push

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to push the dump'
        type: choice
        required: true
        default: 'github'
        options:
          - github
          - gitlab
      visibility:
        description: 'Repository visibility (GitLab or GitHub)'
        type: choice
        required: true
        default: 'public'
        options:
          - public
          - private
      firmware_url:
        description: 'Public firmware URL (overrides FIRMWARE_URL secret when set)'
        type: string
        required: false
      requested_by:
        description: 'Optional requester name or Telegram @handle'
        type: string
        required: false
  issues:
    types:
      - opened
      - labeled

permissions:
  contents: read
  issues: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.labels.*.name, 'dump-request') &&
        (
          contains(github.event.issue.labels.*.name, 'dump-approved') ||
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        )
      )

    steps:
      - name: Resolve inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_URL: ${{ inputs.firmware_url }}
          SECRET_URL: ${{ secrets.FIRMWARE_URL }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_VISIBILITY: ${{ inputs.visibility }}
          INPUT_REQUESTED_BY: ${{ inputs.requested_by }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          event = os.environ.get("EVENT_NAME", "")
          url = os.environ.get("INPUT_URL", "").strip() or os.environ.get("SECRET_URL", "").strip()
          target = (os.environ.get("INPUT_TARGET", "") or "github").strip().lower()
          visibility = (os.environ.get("INPUT_VISIBILITY", "") or "public").strip().lower()
          requested_by = os.environ.get("INPUT_REQUESTED_BY", "").strip()

          if event == "issues":
              body = os.environ.get("ISSUE_BODY", "")
              def parse_field(heading):
                  m = re.search(rf"^###\s+{re.escape(heading)}\s*\r?\n+([^\r\n#]+)", body, re.MULTILINE)
                  if not m:
                      return ""
                  val = m.group(1).strip()
                  return "" if val == "_No response_" else val

              parsed_url = parse_field("Firmware URL")
              if parsed_url:
                  url = parsed_url
              parsed_target = parse_field("Push Target").lower()
              if parsed_target in ("github", "gitlab"):
                  target = parsed_target
              parsed_vis = parse_field("Repository Visibility").lower()
              if parsed_vis in ("public", "private"):
                  visibility = parsed_vis
              parsed_req = parse_field("Requested By")
              requested_by = parsed_req or f"@{os.environ.get('ISSUE_AUTHOR', '')}".strip("@")
              if parsed_req == "" and os.environ.get("ISSUE_AUTHOR"):
                  requested_by = "@" + os.environ["ISSUE_AUTHOR"]

          if target not in ("github", "gitlab"):
              target = "github"
          if visibility not in ("public", "private"):
              visibility = "public"

          if not url:
              print("::error::firmware_url input or FIRMWARE_URL secret is required", file=sys.stderr)
              sys.exit(1)
          if not re.match(r"^(https?|ftp)://\S+$", url):
              print("::error::Invalid firmware_url; must be a single http(s):// or ftp:// URL without spaces", file=sys.stderr)
              sys.exit(1)

          requested_by = re.sub(r"[\r\n]+", " ", requested_by)[:64].strip()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"firmware_url={url}\n")
              out.write(f"target={target}\n")
              out.write(f"visibility={visibility}\n")
              out.write(f"requested_by={requested_by}\n")
          PY

      - name: Validate secrets
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_TOKEN || secrets.DUMP_GITHUB_TOKEN }}
          GH_SSH_KEY: ${{ secrets.GH_SSH_KEY || secrets.GITHUB_SSH_KEY }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
        run: |
          if [[ "${TARGET}" == "github" ]]; then
            if [[ -z "${GH_PAT}" ]]; then
              echo "::error::GH_PAT (or GH_TOKEN) secret is required for github target"
              exit 1
            fi
            if [[ -z "${GH_SSH_KEY}" ]]; then
              echo "::error::GH_SSH_KEY (or GITHUB_SSH_KEY) secret is required for github target"
              exit 1
            fi
          else
            if [[ -z "${GITLAB_TOKEN}" ]]; then
              echo "::error::GITLAB_TOKEN secret is required for gitlab target"
              exit 1
            fi
            if [[ -z "${GITLAB_SSH_KEY}" ]]; then
              echo "::error::GITLAB_SSH_KEY secret is required for gitlab target"
              exit 1
            fi
          fi

      - name: Notify Telegram (started)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          FIRMWARE_URL: ${{ steps.resolve.outputs.firmware_url }}
          TARGET: ${{ steps.resolve.outputs.target }}
          VISIBILITY: ${{ steps.resolve.outputs.visibility }}
          REQUESTED_BY: ${{ steps.resolve.outputs.requested_by }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -n "${TG_TOKEN}" ]] || exit 0
          CHAT_ID="${TG_CHAT:-@DumprXDumps}"
          MSG=$(python3 - <<'PY'
          import html, os
          url = html.escape(os.environ["FIRMWARE_URL"])
          target = html.escape(os.environ["TARGET"])
          vis = html.escape(os.environ["VISIBILITY"])
          req = html.escape(os.environ.get("REQUESTED_BY", ""))
          run_url = html.escape(os.environ["RUN_URL"])
          lines = [
              "🚀 <b>DumprX Dump Started</b>",
              f"<b>Target:</b> <code>{target}</code> (<code>{vis}</code>)",
              f"<b>Firmware URL:</b> <code>{url}</code>",
          ]
          if req:
              lines.append(f"<b>Requested by:</b> <code>{req}</code>")
          lines.append(f'<a href="{run_url}">View Workflow Logs</a>')
          print("\n".join(lines))
          PY
          )
          ARGS=(-sS --data-urlencode "text=${MSG}" --data-urlencode "chat_id=${CHAT_ID}" --data "parse_mode=HTML" --data "disable_web_page_preview=True")
          [[ -n "${TG_THREAD_ID}" ]] && ARGS+=(--data-urlencode "message_thread_id=${TG_THREAD_ID}")
          curl "${ARGS[@]}" "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" > /dev/null || true

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout DumprX
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            unace unrar zip unzip p7zip-full sharutils rar \
            uudeview mpack arj cabextract device-tree-compiler liblzma-dev \
            python3-pip brotli lz4 axel gawk aria2 detox cpio \
            rename liblz4-dev jq git-lfs rsync file libarchive-tools zstd

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up SSH
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
          GH_SSH_KEY: ${{ secrets.GH_SSH_KEY || secrets.GITHUB_SSH_KEY }}
          GITLAB_INSTANCE: ${{ secrets.GITLAB_INSTANCE || 'gitlab.com' }}
        run: |
          mkdir -p ~/.ssh
          if [[ "${TARGET}" == "github" ]]; then
            printf '%s\n' "${GH_SSH_KEY}" > ~/.ssh/id_dumprx
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
            {
              echo "Host github.com"
              echo "  IdentityFile ~/.ssh/id_dumprx"
              echo "  IdentitiesOnly yes"
            } > ~/.ssh/config
            echo "Configured SSH for github.com"
          else
            printf '%s\n' "${GITLAB_SSH_KEY}" > ~/.ssh/id_dumprx
            ssh-keyscan -H "${GITLAB_INSTANCE}" >> ~/.ssh/known_hosts 2>/dev/null
            {
              echo "Host ${GITLAB_INSTANCE}"
              echo "  IdentityFile ~/.ssh/id_dumprx"
              echo "  IdentitiesOnly yes"
            } > ~/.ssh/config
            echo "Configured SSH for ${GITLAB_INSTANCE}"
          fi
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_dumprx ~/.ssh/config
          git config --global user.email "dumprx@github.actions"
          git config --global user.name "DumprX CI"

      - name: Verify SSH connection
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          GITLAB_INSTANCE: ${{ secrets.GITLAB_INSTANCE || 'gitlab.com' }}
          GITLAB_SSH_USER: ${{ secrets.GITLAB_SSH_USER || 'git' }}
        run: |
          if [[ "${TARGET}" == "github" ]]; then
            HOST="github.com"
            SSH_USER="git"
            KEY_NAME="GH_SSH_KEY"
          else
            HOST="${GITLAB_INSTANCE}"
            SSH_USER="${GITLAB_SSH_USER}"
            KEY_NAME="GITLAB_SSH_KEY"
          fi
          echo "Testing SSH connection to ${HOST}..."
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -T "${SSH_USER}@${HOST}" 2>&1; then
            echo "SSH connection successful."
          else
            exit_code=$?
            if [ "$exit_code" -eq 1 ]; then
              echo "SSH connection successful (exit code 1 = remote closed)."
            else
              echo "::error::SSH connection to ${HOST} failed with exit code ${exit_code}."
              echo "::error::Check that ${KEY_NAME} is a valid private key registered on your ${HOST} account."
              exit "$exit_code"
            fi
          fi

      - name: Write .dumprxenv
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_INSTANCE: ${{ secrets.GITLAB_INSTANCE || 'gitlab.com' }}
          GITLAB_GROUP: ${{ secrets.GITLAB_GROUP }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GH_TOKEN || secrets.DUMP_GITHUB_TOKEN }}
          GITHUB_ORG: ${{ secrets.GH_ORG || secrets.GITHUB_ORG }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          REQUESTED_BY: ${{ steps.resolve.outputs.requested_by }}
        run: |
          python3 - <<'PY'
          import os, shlex

          keys = ["TG_TOKEN", "TG_CHAT", "TG_THREAD_ID", "REQUESTED_BY"]
          if os.environ.get("TARGET") == "github":
              keys = ["GITHUB_TOKEN", "GITHUB_ORG"] + keys
          else:
              keys = ["GITLAB_TOKEN", "GITLAB_INSTANCE", "GITLAB_GROUP"] + keys

          with open(".dumprxenv", "w", encoding="utf-8") as f:
              for k in keys:
                  v = os.environ.get(k, "")
                  f.write(f"export {k}={shlex.quote(v)}\n")
          PY

      - name: Extract firmware (local mode)
        env:
          FIRMWARE_URL: ${{ steps.resolve.outputs.firmware_url }}
        run: |
          chmod +x dumper.sh
          ./dumper.sh -l "${FIRMWARE_URL}"

      - name: Prune unnecessary data
        run: |
          sudo rm -rf /tmp/out/tr_region/operator/
          echo "Auto-detecting and deleting Google Apps..."
          sudo find /tmp/out -type f -name "*.apk" | grep -iE "google|gms|velvet|chrome|youtube|ytmusic|gmail|maps|photos|meet|arcore|speechservices|wellbeing|talkback|setupwizard|androidauto|partnersetup|playautoinstall|privatecompute|familylink|phonesky|trichromelibrary|captiveportallogingoogle|documentsuigoogle|networkstackgoogle" | while read -r apk; do
            echo "Deleting: $apk"
            sudo rm -f "$apk"
          done
          sudo find /tmp/out -type d -empty ! -path "*/lost+found*" -delete
          df -h /tmp/out | tail -1

      - name: Push firmware
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          VISIBILITY: ${{ steps.resolve.outputs.visibility }}
          VENDOR: "Generic"
        run: |
          PUBLIC_FLAG=""
          if [[ "${VISIBILITY}" == "public" ]]; then
            PUBLIC_FLAG="--public"
          fi
          export MANUFACTURER="${MANUFACTURER:-Generic}"
          if [[ "${TARGET}" == "github" ]]; then
            ./dumper.sh -b -p ${PUBLIC_FLAG}
          else
            ./dumper.sh -g -p ${PUBLIC_FLAG}
          fi

      - name: Notify Telegram (failed)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          FIRMWARE_URL: ${{ steps.resolve.outputs.firmware_url }}
          REQUESTED_BY: ${{ steps.resolve.outputs.requested_by }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -n "${TG_TOKEN}" ]] || exit 0
          [[ -f /tmp/out/.already_dumped ]] && exit 0
          CHAT_ID="${TG_CHAT:-@DumprXDumps}"
          MSG=$(python3 - <<'PY'
          import html, os
          url = html.escape(os.environ.get("FIRMWARE_URL", "unknown"))
          req = html.escape(os.environ.get("REQUESTED_BY", ""))
          run_url = html.escape(os.environ["RUN_URL"])
          lines = [
              "❌ <b>DumprX Dump Failed</b>",
              f"<b>Firmware URL:</b> <code>{url}</code>",
          ]
          if req:
              lines.append(f"<b>Requested by:</b> <code>{req}</code>")
          lines.append(f'<a href="{run_url}">Inspect Workflow Logs</a>')
          print("\n".join(lines))
          PY
          )
          ARGS=(-sS --data-urlencode "text=${MSG}" --data-urlencode "chat_id=${CHAT_ID}" --data "parse_mode=HTML" --data "disable_web_page_preview=True")
          [[ -n "${TG_THREAD_ID}" ]] && ARGS+=(--data-urlencode "message_thread_id=${TG_THREAD_ID}")
          curl "${ARGS[@]}" "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" > /dev/null || true

      - name: Comment on trigger issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const status = "${{ job.status }}";
            const body = status === "success"
              ? `✅ Firmware dump completed! Check the Telegram group or [workflow logs](${runUrl}) for the dump link.`
              : `❌ Firmware dump finished with status **${status}**. See [workflow logs](${runUrl}).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            if (status === "success") {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: "closed",
              });
            }
